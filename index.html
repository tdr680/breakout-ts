<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple browser-based Breakout game." />
    <title>Breakout</title>
  </head>
  <body>
    <main class="game-shell">
      <h1>Breakout</h1>
      <p id="status" class="status" aria-live="polite">Game surface ready</p>
      <canvas
        id="game-canvas"
        width="640"
        height="480"
        aria-label="Breakout game area"
      ></canvas>
      <div class="game-controls">
        <p>Controls: Left and Right Arrow keys</p>
        <button id="restart-button" type="button">Restart</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
